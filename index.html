<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blockchain Certificate System</title>

    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 0;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #444;
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 25px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5a67d8;
        }

        .section {
            margin-bottom: 30px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f4f4f4;
            font-size: 16px;
        }

        .valid {
            color: green;
            font-weight: bold;
        }

        .invalid {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>🎓 Blockchain Certificate System</h1>

    <div class="section">
        <h2>➕ Add Certificate</h2>
        <input type="text" id="id" placeholder="Certificate ID">
        <input type="text" id="name" placeholder="Student Name">
        <input type="text" id="course" placeholder="Course Name">
        <button onclick="addCertificate()">Add Certificate</button>
    </div>

    <div class="section">
        <h2>🔍 Verify Certificate</h2>
        <input type="text" id="verifyId" placeholder="Enter Certificate ID">
        <button onclick="verifyCertificate()">Verify Certificate</button>

        <div id="result"></div>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
